; Wrist exo sensor firmware: Adafruit Feather ESP32-S3 + micro-ROS (Jazzy)
; https://docs.platformio.org/page/projectconf.html

[env:feather_s3]
platform = espressif32@6.9.0   ; micro_ros_platformio breaks on espressif32 >=7 (flag-format change)
board = adafruit_feather_esp32s3
framework = arduino
monitor_speed = 115200

; micro-ROS
board_microros_distro = jazzy
board_microros_transport = serial      ; switch to wifi later
; custom messages in extra_packages/ (wrist_exo_msgs) are built into libmicroros

lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
    adafruit/Adafruit ICM20X
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit BusIO
